name: Update gallery manifest

on:
  schedule:
    - cron: '23 3 * * 1'   # 每周一 03:23 UTC（北京时间 11:23）
  workflow_dispatch:        # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pypinyin

      - name: Rebuild manifest from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # 可选：数据集转为私有时才需要
        run: python tools/build_manifest.py

      - name: Commit if changed
        run: |
          if git diff --quiet manifest.json; then
            echo "manifest.json 无变化"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: 刷新图库目录清单 [skip ci]"
            git push
          fi
