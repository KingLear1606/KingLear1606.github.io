<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>我的图库</title>
<meta name="description" content="按原始目录结构浏览照片，数据来自公开的 Hugging Face 数据集。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/style.css?v=20261008c" />
</head>
<body>
<noscript>
  <div class="error-box" style="margin:60px auto">
    <p>本站需要启用 JavaScript 才能浏览照片。</p>
  </div>
</noscript>
<header class="topbar">
  <button class="icon-btn" id="sidebarToggle" title="目录" aria-label="切换目录">☰</button>
  <a class="brand" href="#/">📷 我的图库</a>
  <div class="search-box">
    <input id="search" type="search" placeholder="搜索文件夹或照片名…" autocomplete="off" aria-label="搜索" />
    <button class="icon-btn" id="searchClear" title="清除搜索" aria-label="清除搜索">✕</button>
  </div>
  <div class="stats" id="stats">加载中…</div>
  <button class="icon-btn mode-btn" id="mirrorToggle" aria-pressed="true" title="图片走 hf-mirror.com 镜像站，点击切回官方站">镜像</button>
  <button class="icon-btn mode-btn" id="thumbToggle" aria-pressed="false" title="网格直接加载原图，点击切换为缩略图">原图</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">目录</div>
    <nav id="tree" class="tree" aria-label="文件夹树"></nav>
  </aside>

  <main class="main">
    <nav class="breadcrumb" id="breadcrumb" aria-label="路径"></nav>
    <div class="folder-meta" id="folderMeta"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
    <nav class="pager" id="pager" hidden aria-label="分页">
      <button class="btn" id="prevPage" title="上一页 (←)">‹ 上一页</button>
      <div class="page-list" id="pageList"></div>
      <button class="btn" id="nextPage" title="下一页 (→)">下一页 ›</button>
      <span class="page-info" id="pageInfo"></span>
    </nav>
  </main>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-toolbar">
    <span class="lb-title" id="lbTitle"></span>
    <span class="lb-count" id="lbCount"></span>
    <a class="icon-btn" id="lbOpen" target="_blank" rel="noopener" title="在 Hugging Face 官方站打开">↗</a>
    <a class="icon-btn" id="lbDownload" download title="下载原图">⭳</a>
    <button class="icon-btn" id="lbClose" title="关闭 (Esc)">✕</button>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev" title="上一张 (←)" aria-label="上一张">‹</button>
  <figure class="lb-stage">
    <img id="lbImage" alt="" />
    <figcaption id="lbCaption"></figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lbNext" title="下一张 (→)" aria-label="下一张">›</button>
</div>

<!-- ?v= 是给静态资源加的版本号：GitHub Pages 的 max-age=600 会让浏览器缓存 app.js，
     改版后 bump 一下这个日期串，用户普通刷新就能拿到新代码 -->
<script src="assets/app.js?v=20261008c"></script>
</body>
</html>
